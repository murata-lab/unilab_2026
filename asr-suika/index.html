<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="声で進んでスイカを割る、1分間のスイカ割りゲーム"
    />
    <title>声でスイカ割り！</title>
  </head>
  <body>
    <main>
      <div class="title-row">
        <div>
          <p class="eyebrow">VOICE CONTROLLED BEACH GAME</p>
          <h1>声でスイカ割り！</h1>
        </div>
        <div class="header-actions">
          <p class="commands">
            モードを選んでゲームスタート
          </p>
          <button id="fullscreen-toggle" type="button">全画面 <kbd>F</kbd></button>
        </div>
      </div>
      <div id="game" aria-label="音声操作スイカ割りゲーム"></div>
      <p class="fallback">
        キーボードでも操作できます：
        <kbd>↑</kbd> すすめ・<kbd>↓</kbd> とまれ・
        <kbd>←</kbd><kbd>→</kbd> 方向転換・<kbd>Space</kbd> たたけ
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
